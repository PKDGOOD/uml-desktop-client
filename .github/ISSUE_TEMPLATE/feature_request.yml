name: Feature request
description: Describe a problem or workflow the editor should support.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Who needs this and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we verify that this solves the problem?
